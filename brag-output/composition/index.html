<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Coolie launch video</title>
<style>
  @font-face { font-family: P; src: url(../work/fonts/Poppins_400Regular.ttf); font-weight: 400; }
  @font-face { font-family: P; src: url(../work/fonts/Poppins_500Medium.ttf); font-weight: 500; }
  @font-face { font-family: P; src: url(../work/fonts/Poppins_600SemiBold.ttf); font-weight: 600; }
  @font-face { font-family: P; src: url(../work/fonts/Poppins_700Bold.ttf); font-weight: 700; }
  @font-face { font-family: P; src: url(../work/fonts/Poppins_800ExtraBold.ttf); font-weight: 800; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #FBF6F4; }
  body { font-family: P, sans-serif; -webkit-font-smoothing: antialiased; }
  .abs { position: absolute; }
  .full { left: 0; top: 0; width: 1920px; height: 1080px; }
  #stage { overflow: hidden; }
  .line { white-space: nowrap; line-height: 1.12; }
  .word { display: inline-block; will-change: transform, opacity; }
  /* Phone */
  #phone { width: 422px; height: 916px; border-radius: 62px; background: #121212;
    box-shadow: 0 50px 100px rgba(122, 14, 18, 0.26), 0 18px 36px rgba(36, 22, 22, 0.18), inset 0 0 0 2px #2a2a2a; }
  #screen { left: 11px; top: 11px; width: 400px; height: 894px; border-radius: 51px; overflow: hidden; background: #FBF6F4; }
  .layer { left: 0; top: 0; width: 400px; height: 894px; overflow: hidden; background: #FBF6F4; }
  .layer img { position: absolute; left: 0; top: 28px; width: 400px; height: 866px; }
  .sbar { position: absolute; left: 0; top: 0; width: 400px; height: 28px; }
  .sbar .time { position: absolute; left: 30px; top: 5px; font-size: 14px; font-weight: 600; letter-spacing: 0.2px; }
  .sbar svg { position: absolute; right: 26px; top: 8px; }
  #cam { left: 205px; top: 20px; width: 12px; height: 12px; border-radius: 6px; background: #050505; box-shadow: 0 0 0 2px #1b1b1b; }
  .tap { width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 23px; background: rgba(255, 255, 255, 0.6);
    border: 3px solid rgba(36, 22, 22, 0.45); box-sizing: border-box; }
  .ring { width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 23px; border: 3px solid rgba(255, 255, 255, 0.9); box-sizing: border-box; }
  /* Steps */
  .step { left: 170px; height: 76px; display: flex; align-items: center; gap: 26px; }
  .num { width: 64px; height: 64px; border-radius: 32px; box-sizing: border-box; border: 3px solid #E2CDCA; display: flex;
    align-items: center; justify-content: center; font-weight: 700; font-size: 28px; color: #9B8584; background: #fff; }
  .stepLabel { font-size: 46px; font-weight: 600; color: #9B8584; white-space: nowrap; }
  .card { background: #fff; border-radius: 30px; box-shadow: 0 18px 40px rgba(122, 14, 18, 0.12); border: 1px solid #F0E2E0; }
  .billa { display: inline-flex; align-items: center; padding: 10px 26px; border-radius: 999px; font-weight: 800; font-size: 30px; letter-spacing: 3px;
    color: #3A2A08; background: linear-gradient(180deg, #F2D483 0%, #D9A93A 55%, #B98A22 100%); border: 3px solid #8E6914; box-shadow: 0 6px 14px rgba(185, 138, 34, 0.35); }
  .chip { left: 170px; display: flex; align-items: center; gap: 20px; font-size: 34px; font-weight: 500; color: #fff; white-space: nowrap; }
  .chip .dot { width: 46px; height: 46px; border-radius: 23px; background: rgba(232, 196, 104, 0.16); display: flex; align-items: center; justify-content: center; }
</style>
<script src="manifest.js"></script>
</head>
<body>
<div id="stage" class="abs full">
  <!-- Backgrounds -->
  <div id="cream" class="abs full" style="background:#FBF6F4"></div>
  <svg id="tracks" class="abs" width="1920" height="1080" viewBox="0 0 1920 1080" style="left:0;top:0">
    <defs>
      <radialGradient id="glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#D3252B" stop-opacity="0.13" />
        <stop offset="100%" stop-color="#D3252B" stop-opacity="0" />
      </radialGradient>
    </defs>
    <circle cx="1340" cy="540" r="560" fill="url(#glow)" />
    <g id="trackLines" stroke="#D3252B" stroke-opacity="0.10" fill="none"></g>
  </svg>
  <div id="night" class="abs full" style="background:#1A1011"></div>
  <div id="nightEdge" class="abs" style="top:0;width:6px;height:1080px;background:#E8C468"></div>

  <!-- Text layers are created by script into #texts -->
  <div id="texts" class="abs full"></div>

  <!-- Phone -->
  <div id="phone" class="abs">
    <div id="screen" class="abs">
      <div id="layerA" class="abs layer"><div class="sbar"></div><img></div>
      <div id="layerB" class="abs layer"><div class="sbar"></div><img></div>
      <div id="layerC" class="abs layer" style="background:transparent"><img></div>
      <div id="taps" class="abs" style="left:0;top:0;width:400px;height:894px"></div>
    </div>
    <div id="cam" class="abs"></div>
  </div>

  <!-- Hook: full red that shrinks into the app icon -->
  <div id="redTile" class="abs" style="background:#D3252B"></div>
  <div id="partnerTile" class="abs" style="background:#2B1517;box-shadow:inset 0 0 0 2px rgba(255,255,255,0.12)">
    <div id="ribbon" class="abs" style="background:#E8C468;border-radius:6px;color:#1A1011;font-weight:800;letter-spacing:1.6px;text-align:center">PARTNER</div>
  </div>
  <svg id="figure" class="abs" viewBox="0 0 64 64" style="overflow:visible">
    <line id="floor" x1="6" y1="28.4" x2="58" y2="28.4" stroke="#fff" stroke-width="1.1" stroke-linecap="round" />
    <g id="porter">
      <path d="M21 47 L18.5 28.5" stroke="#fff" stroke-width="4.5" stroke-linecap="round" />
      <path d="M43 47 L45.5 28.5" stroke="#fff" stroke-width="4.5" stroke-linecap="round" />
      <circle cx="32" cy="35.5" r="6.5" fill="#fff" />
      <path d="M15 60 C15 49 22 44.5 32 44.5 C42 44.5 49 49 49 60 Z" fill="#fff" />
      <circle cx="43.5" cy="51" r="3.2" fill="#B98A22" />
    </g>
    <g id="suitcase">
      <rect x="26.5" y="6" width="11" height="6" rx="2.5" stroke="#fff" stroke-width="2.5" fill="none" />
      <rect x="16" y="10.5" width="32" height="17" rx="3.5" fill="#fff" />
      <rect x="30.5" y="10.5" width="3" height="17" fill="#B98A22" />
    </g>
  </svg>
  <div id="hookTexts" class="abs full" style="pointer-events:none"></div>

  <!-- Outro -->
  <div id="redEnd" class="abs full" style="background:#D3252B"></div>
  <svg id="endFigure" class="abs" viewBox="0 0 64 64">
    <rect x="26.5" y="6" width="11" height="6" rx="2.5" stroke="#fff" stroke-width="2.5" fill="none" />
    <rect x="16" y="10.5" width="32" height="17" rx="3.5" fill="#fff" />
    <rect x="30.5" y="10.5" width="3" height="17" fill="#B98A22" />
    <path d="M21 47 L18.5 28.5" stroke="#fff" stroke-width="4.5" stroke-linecap="round" />
    <path d="M43 47 L45.5 28.5" stroke="#fff" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="32" cy="35.5" r="6.5" fill="#fff" />
    <path d="M15 60 C15 49 22 44.5 32 44.5 C42 44.5 49 49 49 60 Z" fill="#fff" />
    <circle cx="43.5" cy="51" r="3.2" fill="#E8C468" />
  </svg>
  <div id="endTexts" class="abs full"></div>
</div>

<script>
// ---------- helpers: every frame is a pure function of t ----------
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, a, b) => clamp01((t - a) / (b - a));
const eOut = (p) => 1 - Math.pow(1 - p, 3);
const eIn = (p) => p * p * p;
const eInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const eBack = (p) => { const s = 1.5; return 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); };
const $ = (id) => document.getElementById(id);
const css = (el, o) => Object.assign(el.style, o);

const C = { red: '#D3252B', ink: '#241616', inkSoft: '#5F4B4A', muted: '#9B8584', brass: '#B98A22', brassLight: '#E8C468', night: '#1A1011', cream: '#FBF6F4' };
const PH = { x: 1129, y: 82 }; // phone resting position
const S = 400 / 780; // screenshot px → screen px
const BAR = 28;

// ---------- text lines ----------
const lines = [];
function addLine(parentId, o) {
  const el = document.createElement('div');
  el.className = 'abs line';
  css(el, { left: o.x + 'px', top: o.y + 'px', fontSize: o.size + 'px', fontWeight: o.weight || 800, color: o.color || C.ink,
    letterSpacing: (o.ls || 0) + 'px', textAlign: o.align || 'left' });
  if (o.align === 'center') css(el, { transform: 'translateX(-50%)' });
  const parts = Array.isArray(o.parts) ? o.parts : [[o.text, null]];
  const words = [];
  for (const [text, color] of parts) {
    for (const w of text.split(' ')) {
      if (!w) continue;
      const span = document.createElement('span');
      span.className = 'word';
      span.textContent = w;
      if (color) span.style.color = color;
      el.appendChild(span);
      el.appendChild(document.createTextNode(' '));
      words.push(span);
    }
  }
  $(parentId).appendChild(el);
  const item = { el, words, ...o };
  lines.push(item);
  return item;
}
function renderLine(L, t) {
  const exitP = L.out != null ? eIn(prog(t, L.out, L.out + 0.24)) : 0;
  L.words.forEach((w, i) => {
    const p = eOut(prog(t, L.in + i * 0.05, L.in + i * 0.05 + 0.4));
    const dy = (1 - p) * 0.42 * L.size - exitP * 0.22 * L.size;
    css(w, { opacity: p * (1 - exitP), transform: `translateY(${dy.toFixed(2)}px)` });
  });
}

// Hook
addLine('hookTexts', { text: 'Heavy luggage?', x: 960, y: 640, size: 112, color: '#fff', align: 'center', in: 0.42, out: 1.5 });
addLine('hookTexts', { text: 'Leave it to us.', x: 960, y: 640, size: 112, color: '#fff', align: 'center', in: 1.74, out: 2.74 });
// Reveal
const word = addLine('texts', { text: 'Coolie', x: 330, y: 262, size: 84, in: 3.25, out: null });
addLine('texts', { text: 'Book a licensed coolie', x: 170, y: 436, size: 80, in: 3.45, out: 6.8 });
addLine('texts', { parts: [['in seconds', C.red]], x: 170, y: 526, size: 80, in: 3.62, out: 6.83 });
addLine('texts', { text: 'Like booking a ride, but for your luggage.', x: 170, y: 664, size: 38, weight: 500, color: C.inkSoft, in: 4.0, out: 6.86 });
// Booking
addLine('texts', { text: 'HOW IT WORKS', x: 170, y: 300, size: 28, weight: 700, color: C.red, ls: 4, in: 7.15, out: 12.8 });
// Tracking
addLine('texts', { text: 'Live tracking', x: 170, y: 336, size: 80, in: 13.12, out: 18.72 });
addLine('texts', { parts: [['till your seat', C.red]], x: 170, y: 426, size: 80, in: 13.28, out: 18.75 });
addLine('texts', { text: 'Licensed porters', x: 170, y: 700, size: 40, weight: 600, color: C.ink, in: 14.75, out: 18.78 });
addLine('texts', { text: 'with railway badge', x: 170, y: 752, size: 40, weight: 600, color: C.ink, in: 14.85, out: 18.8 });
// Partner
addLine('texts', { text: 'Coolie Partner', x: 330, y: 268, size: 68, color: '#fff', in: 19.3, out: 24.75 });
addLine('texts', { text: 'More trips. Fair pay.', x: 170, y: 436, size: 80, color: '#fff', in: 19.5, out: 24.78 });
addLine('texts', { parts: [['Respect.', C.brassLight]], x: 170, y: 526, size: 80, in: 19.75, out: 24.8 });
// Outro
addLine('endTexts', { text: 'Coolie', x: 960, y: 452, size: 120, color: '#fff', align: 'center', in: 25.35 });
addLine('endTexts', { text: 'Your luggage, our shoulders.', x: 960, y: 618, size: 64, weight: 700, color: '#fff', align: 'center', in: 25.65 });
addLine('endTexts', { text: 'Licensed railway porters, booked like a ride.', x: 960, y: 716, size: 38, weight: 500, color: 'rgba(255,255,255,0.86)', align: 'center', in: 26.05 });
addLine('endTexts', { parts: [['Passenger app', '#fff'], ['+', C.brassLight], ['Coolie Partner app', '#fff'], ['·', C.brassLight], ['English + हिंदी', '#fff']],
  x: 960, y: 936, size: 30, weight: 600, align: 'center', in: 26.5 });

// ---------- steps + fare card (booking scene) ----------
const STEPS = [
  { label: 'Enter your PNR', y: 360, on: 7.2, done: 8.75 },
  { label: 'Pick where to meet', y: 470, on: 8.75, done: 9.9 },
  { label: 'Add your bags', y: 580, on: 9.9, done: 11.15 },
];
const stepEls = STEPS.map((s, i) => {
  const row = document.createElement('div');
  row.className = 'abs step';
  row.style.top = s.y + 'px';
  row.innerHTML = `<div class="num">${i + 1}</div><div class="stepLabel">${s.label}</div>`;
  $('texts').appendChild(row);
  return row;
});
const fare = document.createElement('div');
fare.className = 'abs card';
css(fare, { left: '170px', top: '714px', width: '700px', height: '150px' });
fare.innerHTML = `
  <div class="abs" style="left:36px;top:30px;font-size:36px;font-weight:600;color:${C.ink};white-space:nowrap">Fair prices by weight</div>
  <div class="abs" style="left:36px;top:84px;font-size:26px;font-weight:500;color:${C.muted};white-space:nowrap">56 kg · 1 coolie · no bargaining</div>
  <div class="abs" style="right:36px;top:34px;font-size:66px;font-weight:800;color:${C.red}">₹220</div>`;
$('texts').appendChild(fare);

// ---------- billa (tracking) ----------
const billa = document.createElement('div');
billa.className = 'abs billa';
css(billa, { left: '170px', top: '588px' });
billa.textContent = 'CSMT-773';
$('texts').appendChild(billa);

// ---------- partner chips ----------
const CHIPS = [['Trips at your station', 20.35], ['Fixed fares', 20.6], ['Weekly payouts', 20.85]];
const tick = `<svg width="24" height="24" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" stroke="#E8C468" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const chipEls = CHIPS.map(([label], i) => {
  const c = document.createElement('div');
  c.className = 'abs chip';
  c.style.top = 680 + i * 84 + 'px';
  c.innerHTML = `<div class="dot">${tick}</div><div>${label}</div>`;
  $('texts').appendChild(c);
  return c;
});

// ---------- background railway tracks (slow drift) ----------
(function buildTracks() {
  const g = $('trackLines');
  let d = '';
  for (let k = 0; k < 2; k++) {
    const off = k * 46;
    d += `M${1040 + off},-200 C${1180 + off},300 ${1500 + off},700 ${1980 + off},1300 `;
  }
  g.innerHTML = `<path d="${d}" stroke-width="5"/>`;
  let ties = '';
  for (let i = 0; i < 40; i++) ties += `<rect class="tie" width="74" height="10" rx="3" fill="#D3252B" fill-opacity="0.07"/>`;
  g.insertAdjacentHTML('beforeend', ties);
})();
const tiePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
tiePath.setAttribute('d', 'M1063,-200 C1203,300 1523,700 2003,1300');
tiePath.setAttribute('fill', 'none');
$('trackLines').appendChild(tiePath);
const tieLen = tiePath.getTotalLength();

// ---------- phone timeline ----------
// show: screen appears at t with a transition. seq: the live-map frame sequence.
const SEQ_A = 13.0, SEQ_B = 16.4; // map frames 0..28 play over this span, then the arrival frame
const EVENTS = [
  { t: 3.3, img: 'p05-home', tr: 'cut' },
  { t: 7.35, img: 'p06-train', tr: 'push', tap: ['p05-home', 0, 7.2] },
  { t: 7.95, img: 'p07-train-filled', tr: 'fade', tap: ['p06-train', 0, 7.8] },
  { t: 8.75, img: 'p08-point', tr: 'push', tap: ['p07-train-filled', 0, 8.6] },
  { t: 9.3, img: 'p09-point-chosen', tr: 'fade', tap: ['p08-point', 0, 9.15] },
  { t: 9.9, img: 'p10-luggage', tr: 'push', tap: ['p09-point-chosen', 0, 9.75] },
  { t: 10.68, img: 'p11-luggage-filled', tr: 'fade', taps: [['p10-luggage', 0, 10.15], ['p10-luggage', 1, 10.35], ['p10-luggage', 2, 10.55]] },
  { t: 11.15, img: 'p12-when', tr: 'push', tap: ['p11-luggage-filled', 0, 11.0] },
  { t: 11.6, img: 'p14-review-cash', tr: 'push', tap: ['p12-when', 0, 11.45] },
  { t: 13.0, img: 'SEQ', tr: 'push', tap: ['p14-review-cash', 0, 12.55] },
  { t: 17.35, img: 'p17-station', tr: 'fade', tap: ['p16-map-35', 0, 17.2] },
  { t: 19.12, img: 'k02-duty-offline', tr: 'push' },
  { t: 20.15, img: 'k03-duty-online', tr: 'fade', tap: ['k02-duty-offline', 0, 20.0] },
  { t: 21.75, img: 'k04-job', tr: 'push', tap: ['k03-duty-online', 0, 21.6] },
  { t: 23.0, img: 'k06-earnings', tr: 'push' },
];
const TAPLIST = [];
for (const e of EVENTS) {
  if (e.tap) TAPLIST.push(e.tap);
  if (e.taps) TAPLIST.push(...e.taps);
}
const tapEls = TAPLIST.map(() => {
  const a = document.createElement('div'); a.className = 'abs tap';
  const r = document.createElement('div'); r.className = 'abs ring';
  $('taps').appendChild(r); $('taps').appendChild(a);
  return [a, r];
});

function imageAt(ev, t) {
  if (ev.img !== 'SEQ') return { src: ev.img };
  const n = 28;
  if (t >= SEQ_B) return { src: MAPS[29] };
  const f = prog(t, SEQ_A + 0.3, SEQ_B) * n;
  const i = Math.min(n - 1, Math.floor(f));
  return { src: MAPS[i], blend: MAPS[i + 1], alpha: f - i };
}

const layerA = $('layerA'), layerB = $('layerB'), layerC = $('layerC');
function setLayer(layer, name) {
  const img = layer.querySelector('img');
  const want = `../work/shots/${name}.png`;
  const changed = img.dataset.src !== want;
  if (changed) { img.dataset.src = want; img.src = want; }
  const bar = layer.querySelector('.sbar');
  if (bar) {
    const sh = SHOTS[name] || { bar: '#FBF6F4', dark: false };
    const fg = sh.dark ? '#fff' : '#241616';
    if (bar.dataset.name !== name) {
      bar.dataset.name = name;
      bar.style.background = sh.bar;
      bar.innerHTML = `<div class="time" style="color:${fg}">9:41</div>
        <svg width="62" height="13" viewBox="0 0 62 13"><g fill="${fg}">
          <rect x="0" y="8" width="3" height="5" rx="1"/><rect x="5" y="5.5" width="3" height="7.5" rx="1"/><rect x="10" y="3" width="3" height="10" rx="1"/><rect x="15" y="0.5" width="3" height="12.5" rx="1"/>
          <path d="M27 4.2a9 9 0 0 1 12 0l-1.6 1.7a6.6 6.6 0 0 0-8.8 0zM29.7 7a5 5 0 0 1 6.6 0L33 10.5z"/>
          <rect x="44" y="1" width="15" height="11" rx="3" fill="none" stroke="${fg}" stroke-width="1.3"/><rect x="46" y="3" width="10" height="7" rx="1.5"/><rect x="59.6" y="4.5" width="1.6" height="4" rx="0.8"/>
        </g></svg>`;
    }
  }
  return changed ? img.decode().catch(() => {}) : null;
}

function renderPhone(t) {
  const pending = [];
  // Which event is current?
  let k = -1;
  for (let i = 0; i < EVENTS.length; i++) if (EVENTS[i].t <= t) k = i;
  const cur = EVENTS[Math.max(0, k)];
  const curImg = imageAt(cur, t);
  const prev = k > 0 ? EVENTS[k - 1] : null;
  const dur = cur.tr === 'push' ? 0.34 : cur.tr === 'fade' ? 0.2 : 0;
  const p = dur ? clamp01((t - cur.t) / dur) : 1;
  pending.push(setLayer(layerB, curImg.src));
  if (prev && p < 1) {
    const prevImg = imageAt(prev, cur.t);
    pending.push(setLayer(layerA, prevImg.src));
    const q = eInOut(p);
    if (cur.tr === 'push') {
      css(layerA, { display: 'block', transform: `translateX(${(-30 * q).toFixed(2)}%)`, filter: `brightness(${(1 - 0.25 * q).toFixed(3)})`, opacity: 1 });
      css(layerB, { transform: `translateX(${(100 * (1 - q)).toFixed(2)}%)`, opacity: 1, boxShadow: '-12px 0 30px rgba(0,0,0,0.18)' });
    } else {
      css(layerA, { display: 'block', transform: 'none', filter: 'none', opacity: 1 });
      css(layerB, { transform: 'none', opacity: q, boxShadow: 'none' });
    }
  } else {
    css(layerA, { display: 'none' });
    css(layerB, { transform: 'none', opacity: 1, boxShadow: 'none' });
  }
  // Map sequence: blend between consecutive frames so the coolie glides.
  if (curImg.blend && curImg.alpha > 0.01) {
    pending.push(setLayer(layerC, curImg.blend));
    css(layerC, { display: 'block', opacity: curImg.alpha.toFixed(3), transform: layerB.style.transform });
  } else css(layerC, { display: 'none' });

  // Touch ripples
  TAPLIST.forEach(([shot, idx, t0], i) => {
    const pt = TAPS[shot][idx];
    const x = pt.x * S, y = pt.y * S + BAR;
    const [dot, ring] = tapEls[i];
    const a = prog(t, t0 - 0.2, t0 - 0.05), press = prog(t, t0 - 0.05, t0 + 0.04), rel = prog(t, t0 + 0.04, t0 + 0.26);
    const vis = t > t0 - 0.2 && t < t0 + 0.3;
    const sc = lerp(1.35, 1, eOut(a)) * lerp(1, 0.82, press) * lerp(1, 1.1, rel);
    css(dot, { display: vis ? 'block' : 'none', left: x + 'px', top: y + 'px', opacity: (eOut(a) * (1 - rel)).toFixed(3), transform: `scale(${sc.toFixed(3)})` });
    const rp = prog(t, t0, t0 + 0.45);
    css(ring, { display: t > t0 && rp < 1 ? 'block' : 'none', left: x + 'px', top: y + 'px', opacity: ((1 - rp) * 0.9).toFixed(3), transform: `scale(${(1 + eOut(rp) * 1.9).toFixed(3)})` });
  });

  // Phone position: slides in at the reveal, steps aside for the outro.
  const inP = eOut(prog(t, 3.3, 3.95));
  const outP = eIn(prog(t, 24.85, 25.25));
  const x = PH.x + (1 - inP) * 760 + outP * 60;
  const y = PH.y + outP * 40;
  const rot = (1 - inP) * 9;
  css($('phone'), { left: x + 'px', top: y + 'px', transform: `rotate(${rot.toFixed(2)}deg) scale(${(1 - outP * 0.06).toFixed(3)})`, display: t < 3.25 || t > 25.4 ? 'none' : 'block' });
  return pending;
}

// ---------- hook figure + tiles ----------
function boxLerp(a, b, p) { return a.map((v, i) => lerp(v, b[i], p)); }
function renderHook(t) {
  // Red: full frame → app icon (3.0s) → small header icon (7.0s) → gone at the partner wipe.
  const m = eInOut(prog(t, 2.78, 3.3));
  const h = eInOut(prog(t, 6.82, 7.25));
  const FULL = [0, 0, 1920, 1080, 0], TILE = [170, 250, 132, 132, 33], HEAD = [170, 116, 84, 84, 21];
  let r = boxLerp(FULL, TILE, m);
  if (h > 0) r = boxLerp(TILE, HEAD, h);
  const gone = prog(t, 18.75, 18.95);
  css($('redTile'), { left: r[0] + 'px', top: r[1] + 'px', width: r[2] + 'px', height: r[3] + 'px', borderRadius: r[4] + 'px', opacity: 1 - gone, display: t > 19 ? 'none' : 'block' });
  // Figure box follows the red: big in the hook, the logo inside the icon after.
  const F1 = [810, 216, 300, 300], F2 = [170, 250, 132, 132], F3 = [170, 116, 84, 84];
  let f = boxLerp(F1, F2, m);
  if (h > 0) f = boxLerp(F2, F3, h);
  let fig = { left: f[0], top: f[1], size: f[2] };
  // Partner: same figure moves into the night tile.
  const pt = eOut(prog(t, 19.3, 19.7));
  const pOut = prog(t, 24.75, 24.95);
  if (t > 18.95) fig = { left: 170, top: 250, size: 132 };
  css($('figure'), { left: fig.left + 'px', top: fig.top + 'px', width: fig.size + 'px', height: fig.size + 'px',
    opacity: t > 18.75 && t < 19.3 ? 1 - gone : t >= 19.3 ? pt * (1 - pOut) : 1,
    transform: t >= 19.3 ? `scale(${lerp(0.7, 1, pt).toFixed(3)})` : 'none' });
  css($('partnerTile'), { left: '170px', top: '250px', width: '132px', height: '132px', borderRadius: '33px', opacity: pt * (1 - pOut),
    transform: `scale(${lerp(0.7, 1, pt).toFixed(3)})`, display: t > 19.25 && t < 25 ? 'block' : 'none' });
  css($('ribbon'), { left: '24px', width: '84px', bottom: '-14px', fontSize: '15px', lineHeight: '24px' });

  // Suitcase drops, porter rises under it (hook only)
  const fall = prog(t, 0.1, 0.4);
  const sy = -64 * (1 - eIn(fall));
  const squash = t > 0.4 && t < 0.62 ? Math.sin(prog(t, 0.4, 0.62) * Math.PI) : 0;
  const lift = prog(t, 1.52, 1.95);
  const liftY = -1.2 * Math.sin(prog(t, 1.78, 2.1) * Math.PI);
  css($('suitcase'), { transformOrigin: '32px 27.5px', transformBox: 'view-box',
    transform: `translateY(${(sy + liftY).toFixed(3)}px) scale(${(1 + squash * 0.08).toFixed(3)}, ${(1 - squash * 0.14).toFixed(3)})`, opacity: t < 0.1 ? 0 : 1 });
  const rise = eBack(lift);
  css($('porter'), { transform: `translateY(${((1 - rise) * 44).toFixed(3)}px)`, opacity: clamp01(lift * 4) });
  css($('floor'), { opacity: (eOut(prog(t, 0.0, 0.25)) * (1 - prog(t, 1.6, 1.85))).toFixed(3) });
  $('floor').style.display = t > 1.9 ? 'none' : 'block';
}

// ---------- backgrounds ----------
function renderBg(t) {
  // Night wipe for the partner scene (right → left, brass leading edge).
  const w = eInOut(prog(t, 18.85, 19.35));
  const edge = 1920 * (1 - w);
  css($('night'), { clipPath: `inset(0 0 0 ${edge.toFixed(1)}px)`, display: t > 18.85 ? 'block' : 'none' });
  css($('nightEdge'), { left: edge - 3 + 'px', display: t > 18.85 && w < 1 ? 'block' : 'none' });
  // Red circle wipe for the outro, from the phone.
  const rr = eInOut(prog(t, 24.85, 25.4)) * 2400;
  css($('redEnd'), { clipPath: `circle(${rr.toFixed(1)}px at 1340px 540px)`, display: t > 24.85 ? 'block' : 'none' });
  // Tracks drift slowly behind the phone.
  const drift = (t * 40) % (tieLen / 40);
  const ties = document.querySelectorAll('#trackLines .tie');
  ties.forEach((el, i) => {
    const s = (i * tieLen) / 40 + drift;
    const p = tiePath.getPointAtLength(Math.min(tieLen, s));
    const p2 = tiePath.getPointAtLength(Math.min(tieLen, s + 1));
    const ang = (Math.atan2(p2.y - p.y, p2.x - p.x) * 180) / Math.PI + 90;
    el.setAttribute('transform', `translate(${p.x.toFixed(1)},${p.y.toFixed(1)}) rotate(${ang.toFixed(1)}) translate(-37,-5)`);
  });
  const trackVis = clamp01(prog(t, 3.3, 3.9)) * (1 - prog(t, 18.85, 19.2));
  css($('tracks'), { opacity: trackVis.toFixed(3) });
}

// ---------- booking steps, fare card, billa, chips ----------
function renderCards(t) {
  STEPS.forEach((s, i) => {
    const row = stepEls[i];
    const inP = eOut(prog(t, 7.15 + i * 0.1, 7.55 + i * 0.1));
    const outP = eIn(prog(t, 12.78 + i * 0.04, 13.0 + i * 0.04));
    const active = t >= s.on && t < s.done, done = t >= s.done;
    const num = row.children[0], label = row.children[1];
    const pop = t >= s.on ? 1 + 0.12 * Math.sin(prog(t, s.on, s.on + 0.3) * Math.PI) : 1;
    css(row, { opacity: inP * (1 - outP), transform: `translateX(${((1 - inP) * -40 - outP * 30).toFixed(1)}px)` });
    css(num, { background: active || done ? C.red : '#fff', borderColor: active || done ? C.red : '#E2CDCA', color: active || done ? '#fff' : C.muted, transform: `scale(${pop.toFixed(3)})` });
    num.innerHTML = done ? `<svg width="30" height="30" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>` : String(i + 1);
    label.style.color = active ? C.ink : done ? C.inkSoft : C.muted;
  });
  const fIn = eOut(prog(t, 11.15, 11.55)), fOut = eIn(prog(t, 12.85, 13.05));
  css(fare, { opacity: fIn * (1 - fOut), transform: `translateY(${((1 - fIn) * 40).toFixed(1)}px) scale(${lerp(0.96, 1, fIn).toFixed(3)})` });
  const bIn = eOut(prog(t, 14.6, 15.0)), bOut = eIn(prog(t, 18.75, 18.95));
  css(billa, { opacity: bIn * (1 - bOut), transform: `scale(${lerp(0.6, 1, eBack(prog(t, 14.6, 15.0))).toFixed(3)})`, transformOrigin: 'left center' });
  chipEls.forEach((c, i) => {
    const t0 = CHIPS[i][1];
    const p = eOut(prog(t, t0, t0 + 0.4)), o = eIn(prog(t, 24.75, 24.95));
    css(c, { opacity: p * (1 - o), transform: `translateX(${((1 - p) * -36).toFixed(1)}px)` });
  });
  // Light wordmark "Coolie" shrinks into the header with the icon.
  const h = eInOut(prog(t, 6.82, 7.25));
  const gone = prog(t, 18.72, 18.92);
  css(word.el, { left: lerp(330, 270, h) + 'px', top: lerp(262, 118, h) + 'px', fontSize: lerp(84, 54, h) + 'px', opacity: 1 - gone, display: t > 19 ? 'none' : 'block' });
}

// ---------- outro ----------
function renderEnd(t) {
  const p = eOut(prog(t, 25.15, 25.7));
  const s = lerp(0.6, 1, eBack(prog(t, 25.15, 25.7)));
  const zoom = 1 + 0.025 * prog(t, 25.3, 30);
  css($('endFigure'), { left: 860 + 'px', top: 170 + 'px', width: '200px', height: '200px', opacity: p, transform: `scale(${(s * zoom).toFixed(4)})`, display: t > 25 ? 'block' : 'none' });
  css($('endTexts'), { transform: `scale(${zoom.toFixed(4)})`, transformOrigin: '960px 540px', display: t > 25 ? 'block' : 'none' });
  css($('hookTexts'), { display: t < 3 ? 'block' : 'none' });
}

window.render = async function (t) {
  renderBg(t);
  renderHook(t);
  renderCards(t);
  lines.forEach((L) => renderLine(L, t));
  const pending = renderPhone(t);
  renderEnd(t);
  await Promise.all(pending.filter(Boolean));
};

window.READY = (async () => {
  await Promise.all([400, 500, 600, 700, 800].map((w) => document.fonts.load(`${w} 40px P`, 'Aa₹हिंदी')));
  await document.fonts.ready;
  const names = Object.keys(SHOTS);
  await Promise.all(names.map((n) => new Promise((res) => { const im = new Image(); im.onload = im.onerror = res; im.src = `../work/shots/${n}.png`; })));
  await window.render(0);
  return true;
})();
</script>
